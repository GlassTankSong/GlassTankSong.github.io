<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鲨啦啦啦的文字宇宙</title>
    <style>
        /* 明亮温暖的配色 */
        :root {
            --bg-color: #fcfaf8; /* 温暖的米白背景 */
            --text-main: #2d3748; /* 深灰主色调 */
            --text-sub: #718096; /* 浅灰副标题 */
            --card-bg: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            padding: 80px 20px 40px 20px;
            max-width: 800px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 15px;
            color: var(--text-main);
            letter-spacing: 2px;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: var(--text-sub);
            line-height: 1.6;
        }

        /* 卡片网格布局 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            box-shadow: var(--shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid #edf2f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .card-desc {
            font-size: 0.95rem;
            color: var(--text-sub);
        }

        /* 每个卡片专属的顶部点缀色 */
        .card.onepiece { border-top: 6px solid #e53e3e; } /* 海贼王：红 */
        .card.rps { border-top: 6px solid #ed64a6; } /* 真人CP：粉 */
        .card.drarry { border-top: 6px solid #4299e1; } /* 德哈：蓝 */
        .card.magic { border-top: 6px solid #ecc94b; } /* 魔法觉醒：黄 */

        footer {
            margin-top: auto;
            padding: 40px;
            color: var(--text-sub);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>鲨啦啦啦的文字宇宙</h1>
        <p class="subtitle">这里存放着鲨啦啦啦写的一些乱七八糟的割腿肉。<br>欢迎来到我的自留地，可能文笔雷霆，但是既然千山万水赶了过来，也祝你阅读愉快。</p>
    </div>

    <div class="grid-container">
        <!-- 卡片 1 -->
        <a href="#" class="card onepiece">
            <div class="card-icon">🏴‍☠️</div>
            <div class="card-title">海贼王</div>
            <div class="card-desc">索路初恋组很是美味，当然同样是得意的香巴佬正在嗑（笑）</div>
        </a>

        <!-- 卡片 2 -->
        <a href="#" class="card rps">
            <div class="card-icon">🌟</div>
            <div class="card-title">RPS系列</div>
            <div class="card-desc">好吧大部分是灿白。</div>
        </a>

        <!-- 卡片 3 -->
        <a href="#" class="card drarry">
            <div class="card-icon">⚡</div>
            <div class="card-title">哈利波特 </div>
            <div class="card-desc">基本上就是德哈，拜托，宿敌简直就是妻子吧……（没有说光头没鼻子怪的意思）</div>
        </a>

        <!-- 卡片 4 -->
        <a href="#" class="card magic">
            <div class="card-icon">🪄</div>
            <div class="card-title">魔法觉醒</div>
            <div class="card-desc">你停服了，那我所有的经济损失呢？</div>
        </a>
    </div>

    <footer>
        © 2026 鲨啦啦啦. Powered by GitHub Pages.
    </footer>

</body>
</html>
